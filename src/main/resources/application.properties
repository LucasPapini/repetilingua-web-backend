spring.application.name=repetilingua

# Define o perfil ativo com fallback para 'prod' se APP_PROFILE não for passada
spring.profiles.active=${APP_PROFILE:prod}
spring.jpa.open-in-view=false

# Mapeamento de Segurança / OAuth2 / JWT (com fallbacks)
security.client-id=${SECURITY_CLIENT_ID:repetilingua}
security.client-secret=${SECURITY_CLIENT_SECRET:repetilingua-secret}
security.jwt.token.secret-key=${JWT_SECRET:secret-key-repetilingua-1234567890-abcdefghijklmnopqrstuvwxyz}
security.jwt.token.expire-length=${JWT_EXPIRE:3600000}

# CORS
cors.origins=${CORS_ORIGINS:https://repetilingua-web-rose.vercel.app}

# Database Connection Properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Baseline
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Tamanho do arquivo para upload de audios
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB